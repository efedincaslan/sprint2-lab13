# PaySprint Merchant Portal - production configuration (excerpt)

# VULNERABILITY (A02): every actuator endpoint exposed, including env (dumps
# configuration, potentially secrets) and heapdump, with no authentication.
# management.endpoints.web.exposure.include=*
# management.endpoint.env.show-values=ALWAYS
management.endpoints.web.exposure.include=health,info
management.endpoint.env.show-values=NEVER

# VULNERABILITY (A02): full stack traces returned to API clients in production.
server.error.include-stacktrace=never
server.error.include-message=never
